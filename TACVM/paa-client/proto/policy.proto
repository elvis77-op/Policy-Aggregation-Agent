syntax = "proto3";

package tacvm.v1;


// ============================================================================
// Hybrid Encryption Wrapper
// ============================================================================
//
// Participant -> TA application-layer encrypted messages use hybrid encryption.
//
// Encryption:
//
//   1. Serialize the original protobuf reply:
//
//        plaintext = Serialize(BusinessReply)
//
//   2. Generate a fresh random symmetric key:
//
//        K = Random(256-bit)
//
//   3. Generate a fresh AEAD nonce:
//
//        N = Random(AES-GCM nonce)
//
//   4. Encrypt the protobuf bytes:
//
//        ciphertext, tag =
//            AES-256-GCM-Encrypt(K, N, plaintext)
//
//   5. Encrypt/wrap K using TA public key PK2:
//
//        encrypted_key = PublicKeyEncrypt(PK2, K)
//
//   6. Return EncryptedPayload.
//
// TA:
//
//   1. Recover K:
//
//        K = PrivateKeyDecrypt(SK2, encrypted_key)
//
//   2. Decrypt ciphertext:
//
//        plaintext = AES-256-GCM-Decrypt(
//            K,
//            nonce,
//            ciphertext,
//            authentication_tag
//        )
//
//   3. Parse plaintext according to message_type.
//
// NOTE:
// The exact public-key algorithm used for PK2/SK2 must be implemented
// consistently by both TA and participants.
// ============================================================================

message EncryptedPayload {

    // Identifies the original protobuf message contained in ciphertext.
    //
    // Expected values:
    //   "QuoteVerificationReply"
    //   "AggregatedPolicyReply"
    string message_type = 1;

    // Fresh symmetric encryption key encrypted/wrapped using TA public key PK2.
    bytes encrypted_key = 2;

    // Fresh nonce/IV used by AES-GCM.
    bytes nonce = 3;

    // AES-GCM encrypted serialized protobuf message.
    bytes ciphertext = 4;

    // AES-GCM authentication tag.
    //
    // If the crypto implementation stores the tag together with ciphertext,
    // this field may be empty by convention.
    bytes authentication_tag = 5;
}


// ============================================================================
// Participant Service
// ============================================================================

service ParticipantService {

    // ------------------------------------------------------------------------
    // Phase 1: Remote Attestation
    // ------------------------------------------------------------------------

    // TA requests a fresh attestation challenge.
    rpc Challenge(
        ChallengeRequest
    ) returns (
        ChallengeReply
    );

    // TA sends an attestation quote that binds the participant-generated nonce
    // and TA public key PK2.
    //
    // Participant returns QuoteVerificationReply encrypted inside
    // EncryptedPayload.
    rpc VerifyQuote(
        QuoteVerificationRequest
    ) returns (
        EncryptedPayload
    );


    // ------------------------------------------------------------------------
    // Phase 4: Aggregated Policy Confirmation
    // ------------------------------------------------------------------------

    // TA sends the aggregated policy to a participant for verification.
    //
    // Participant returns AggregatedPolicyReply encrypted inside
    // EncryptedPayload.
    rpc VerifyAggregatedPolicy(
        AggregatedPolicyRequest
    ) returns (
        EncryptedPayload
    );
}


// ============================================================================
// Phase 1: Remote Attestation
// ============================================================================

message ChallengeRequest {

    // TA identity.
    string client_id = 1;
}


message ChallengeReply {

    // Fresh random nonce generated by the participant.
    //
    // TA must bind this value into the attestation quote.
    bytes nonce = 1;
}


message QuoteVerificationRequest {

    // TA identity.
    string client_id = 1;

    // Attestation quote produced by TA.
    //
    // The quote must bind:
    //
    //   - TA measurement / attestation state
    //   - participant-generated nonce
    //   - H(PK2), or another agreed representation of PK2
    bytes quote = 2;

    // ------------------------------------------------------------------------
    // Key 2: TA public key PK2
    // ------------------------------------------------------------------------
    //
    // Participant verifies that this key, or its hash, is bound to the quote.
    //
    // After successful verification, participant associates PK2 with this
    // successfully attested TA/session.
    bytes attestation_public_key = 3;

    // Measurement hash or expected measurement information, if required by
    // the current remote attestation implementation.
    bytes measurement_hash = 4;

    // Must match the fresh nonce previously generated by this participant
    // and returned in ChallengeReply.
    bytes nonce = 5;

    // Identifier of the requested policy to be returned by the participant.
    // Optional: TA may request a specific policy blob by id.
    string policy_id = 6;
}


// This is the plaintext business message.
//
// It is NOT returned directly by the VerifyQuote RPC.
//
// Participant performs:
//
//   plaintext = Serialize(QuoteVerificationReply)
//   K = GenerateFreshSymmetricKey()
//   nonce = GenerateFreshAeadNonce()
//   ciphertext = AES-GCM-Encrypt(K, plaintext)
//   encrypted_key = PublicKeyEncrypt(PK2, K)
//
// Then returns EncryptedPayload.
message QuoteVerificationReply {

    // True only if all required remote attestation verification succeeds.
    bool accepted = 1;

    // Human-readable reason when accepted == false.
    string error_message = 2;

    // Participant identity.
    string participant_id = 3;

    // Policy blob returned to the TA as part of a successful attestation
    // exchange. The participant includes both the policy bytes and its
    // hash so the TA can verify integrity in one round-trip.
    bytes policy = 4;

    // H(policy) = SHA-256(policy)
    bytes policy_hash = 5;

    // Session identifier established after successful remote attestation.
    bytes session_id = 6;
}


// ============================================================================
// Phase 4: Aggregated Policy Confirmation
// ============================================================================

message AggregatedPolicyRequest {

    // TA identity.
    string client_id = 1;

    // Session established during successful remote attestation.
    bytes session_id = 2;

    // Aggregated policy Π produced by TA's policy aggregation process.
    bytes aggregated_policy = 3;

    // HΠ = SHA-256(aggregated_policy).
    bytes policy_hash = 4;

    // Hash of the agreed participant roster/context.
    //
    // Conceptually:
    //
    //   roster_hash = SHA-256(
    //       Encode(
    //           participant_id_1,
    //           participant_id_2,
    //           ...
    //       )
    //   )
    bytes roster_hash = 5;

    // Fresh random nonce generated by TA specifically for this confirmation
    // request.
    //
    // A separate nonce should be generated for each participant/request.
    //
    // Participant must return this value in AggregatedPolicyReply and include
    // it in its SK3_i signature.
    bytes request_nonce = 6;

    // ------------------------------------------------------------------------
    // Key 2: TA signature
    // ------------------------------------------------------------------------
    //
    // TA signs using SK2:
    //
    //   signed_data = Encode(
    //       "TACVM-AGGREGATED-POLICY",
    //       client_id,
    //       session_id,
    //       policy_hash,
    //       roster_hash,
    //       request_nonce
    //   )
    //
    //   signature = Sign(SK2, signed_data)
    //
    // Participant verifies using PK2 obtained and trusted during Phase 1.
    bytes signature = 7;
}


// This is the plaintext business message.
//
// It is NOT directly returned by VerifyAggregatedPolicy.
//
// Participant:
//
//   1. Verifies SHA-256(aggregated_policy) == policy_hash.
//   2. Verifies TA signature using PK2.
//   3. Verifies session/context/nonce.
//   4. Runs local policy validation.
//   5. Currently sets accepted = true by default.
//   6. Signs the confirmation using SK3_i.
//   7. Serializes this message.
//   8. Encrypts the serialized message using hybrid encryption with PK2.
//   9. Returns EncryptedPayload.
//
    // Signature:
    //
    // Historically this message was signed using a participant-local
    // policy key (SK3_i). PK3/SK3 are not used in the current flow; the
    // `signature` field is retained for compatibility but is not required
    // by the reference implementation.
message AggregatedPolicyReply {

    // Participant identity.
    string participant_id = 1;

    // Result of local aggregated policy verification.
    //
    // Current implementation:
    //   accepted = true
    bool accepted = 2;

    // Must equal AggregatedPolicyRequest.request_nonce.
    bytes request_nonce = 3;

    // Must equal AggregatedPolicyRequest.policy_hash.
    bytes policy_hash = 4;

    // Must equal AggregatedPolicyRequest.roster_hash.
    bytes roster_hash = 5;

    // Signature generated using Participant Policy Private Key SK3_i.
    //
    // Retained for compatibility; not used by the reference codepath.
    bytes signature = 6;
}