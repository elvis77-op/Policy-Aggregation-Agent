syntax = "proto3";

package tacvm.v1;

// Participant -> TA application-layer encrypted reply. The TA decrypts
// ciphertext with its attestation private key and parses it as message_type.
message EncryptedPayload {
    // Expected value: "QuoteVerificationReply".
    string message_type = 1;

    // Fresh symmetric key encrypted/wrapped using the TA public key PK2.
    bytes encrypted_key = 2;

    // Fresh AEAD nonce/IV.
    bytes nonce = 3;

    // AEAD-encrypted serialized business reply.
    bytes ciphertext = 4;

    // AEAD authentication tag, when stored separately from ciphertext.
    bytes authentication_tag = 5;
}

// Participant service. A client obtains and locally compares one verified
// policy reply from each participant. No aggregation or confirmation RPC exists.
service ParticipantService {
    // TA requests a fresh attestation challenge.
    rpc Challenge(ChallengeRequest) returns (ChallengeReply);

    // TA submits its quote and receives an encrypted QuoteVerificationReply.
    rpc VerifyQuote(QuoteVerificationRequest) returns (EncryptedPayload);
}

// Phase 1: Remote attestation.
message ChallengeRequest {
    // TA identity.
    string client_id = 1;
}

message ChallengeReply {
    // Fresh random nonce generated by the participant.
    bytes nonce = 1;
}

message QuoteVerificationRequest {
    // TA identity.
    string client_id = 1;

    // Attestation quote that binds the participant nonce and PK2.
    bytes quote = 2;

    // TA public key PK2, bound to the quote and retained for this session.
    bytes attestation_public_key = 3;

    // Measurement hash or expected measurement information, when required.
    bytes measurement_hash = 4;

    // Must match the nonce returned in ChallengeReply.
    bytes nonce = 5;

    // Identifier of the policy requested from this participant.
    string policy_id = 6;
}

// Plaintext business reply encrypted inside EncryptedPayload returned by
// VerifyQuote. The client verifies policy_hash, collects one policy per
// participant, and exits with failure if any verified policy differs.
message QuoteVerificationReply {
    // True only when remote attestation verification succeeds.
    bool accepted = 1;

    // Human-readable reason when accepted is false.
    string error_message = 2;

    // Participant identity.
    string participant_id = 3;

    // Policy blob returned after successful attestation.
    bytes policy = 4;

    // SHA-256(policy).
    bytes policy_hash = 5;

    // Session identifier established after successful remote attestation.
    bytes session_id = 6;
}
